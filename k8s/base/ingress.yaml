apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsu-demo
  annotations:
    # cluster-issuer is set per overlay (self-signed local, Let's Encrypt on AKS)
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - origin.example.com
      secretName: devsu-demo-tls
  rules:
    - host: origin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsu-demo
                port:
                  number: 80
