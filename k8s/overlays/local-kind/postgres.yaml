# Throwaway postgres for the local kind demo (ephemeral, single replica).
# On AKS this is replaced by a managed PostgreSQL Flexible Server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsu-postgres
  labels:
    app.kubernetes.io/name: devsu-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devsu-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsu-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: devsu
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: devsu-demo-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsu-demo-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "devsu"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devsu-postgres
spec:
  selector:
    app.kubernetes.io/name: devsu-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# allow the app to reach postgres (the default-deny-ingress denies everything else).
# Enforced on AKS (Azure CNI); declarative-only on kind's kindnet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devsu-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devsu-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devsu-demo
      ports:
        - protocol: TCP
          port: 5432
