apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsu-demo
  annotations:
    # Origin lockdown: only Cloudflare PoPs may reach the app. Anyone hitting the
    # public LB IP directly (bypassing the CF edge) gets a 403 from nginx.
    #
    # IMPORTANT: this matches on the TCP source IP, so the ingress-nginx Service
    # must run with externalTrafficPolicy: Local (otherwise nginx sees the Azure
    # LB SNAT address, not the real Cloudflare PoP, and every request is dropped).
    # See aks-live/svc-externaltrafficpolicy.md for the live patch + rollback.
    #
    # CIDR list = Cloudflare egress ranges (ipv4 + ipv6) fetched 2026-05-31 from
    # https://www.cloudflare.com/ips-v4 + ips-v6 (== api.cloudflare.com/client/v4/ips).
    # Kept on one line on purpose: ingress-nginx splits on comma and does not trim
    # whitespace, so no spaces/newlines inside the value. Refresh when CF adds ranges.
    nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
spec:
  tls:
    - hosts:
        - devsu-prod.gcamargo.xyz
      secretName: devsu-demo-tls
  rules:
    - host: devsu-prod.gcamargo.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsu-demo
                port:
                  number: 80
