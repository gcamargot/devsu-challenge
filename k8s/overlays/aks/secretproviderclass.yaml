# Pulls the DB password from Azure Key Vault via the Secrets Store CSI driver
# (AKS azureKeyvaultSecretsProvider addon) and syncs it into a k8s Secret.
# Placeholders (__UPPER__) are filled by the CD job from `terraform output`.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: devsu-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: __KV_CLIENT_ID__
    keyvaultName: __KV_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
  secretObjects:
    - secretName: devsu-demo-secret
      type: Opaque
      data:
        - objectName: db-password
          key: DB_PASSWORD
