name: CD (deploy to AKS)

# Manual or on a release tag. Auth to Azure is via OIDC (no stored secret).
# The vars.* below are set once from `terraform output` after the infra is up.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to sha-<commit>)"
        required: false
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # the image is already public on GHCR (from CI); copy it into ACR so AKS pulls via AcrPull
      - name: Import image into ACR
        run: |
          az acr import --name "${{ vars.ACR_NAME }}" \
            --source "ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}" \
            --image "devsu-challenge:${{ steps.tag.outputs.tag }}" --force

      - uses: sigstore/cosign-installer@v3

      # `az acr import` copies only the image, not the cosign signature/attestations
      # (those live as separate OCI artifacts in GHCR). `cosign copy` brings them along
      # so the image in ACR is signed just like in GHCR and Kyverno can verify it.
      - name: Copy cosign signature/attestations to ACR
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          cosign copy -f \
            "ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}" \
            "${{ vars.ACR_LOGIN_SERVER }}/devsu-challenge:${{ steps.tag.outputs.tag }}"

      - uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "${{ vars.RESOURCE_GROUP }}" --name "${{ vars.AKS_NAME }}" --admin --overwrite-existing

      # The live trial cluster runs the aks-live overlay: image pulled from ACR,
      # postgres in-cluster, Cloudflare Origin CA at the edge. The `aks` overlay is
      # the managed-PG production variant (Key Vault CSI + Let's Encrypt), used once
      # the domain runs on Azure DNS instead of Cloudflare. Only placeholder here is
      # the ACR login server; the sha tag is pinned in the kustomization image block.
      - name: Render overlay (aks-live)
        working-directory: k8s/overlays/aks-live
        run: |
          sed -i \
            -e "s|__ACR_LOGIN_SERVER__|${{ vars.ACR_LOGIN_SERVER }}|g" \
            -e "s|newTag: latest|newTag: ${{ steps.tag.outputs.tag }}|g" \
            kustomization.yaml

      - name: Apply
        run: |
          kubectl apply -k k8s/overlays/aks-live
          kubectl -n devsu rollout status deploy/devsu-demo --timeout=180s
